name: Release image

# Publishes ghcr.io/parkviewlab/jonobones AND the npm package on every
# version tag. workflow_dispatch exists to (re)publish an existing tag —
# e.g. a tag cut before this workflow existed.
#
# Neither job stores long-lived secrets: the image job authenticates with
# the repo's GITHUB_TOKEN, the npm job uses npm trusted publishing (OIDC).
# One-time setup for npm: the package's first version must be published
# manually, then the trusted publisher (this repo + release.yml, allowed
# action: publish) is configured at npmjs.com → jonobones → Settings.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to (re)publish, e.g. v0.1.0'
        required: true
        type: string

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # arm64 covers the NAS/Pi/Apple-Silicon server crowd.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/parkviewlab/jonobones
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm test

      - name: Publish jonobones (skips when already on the registry)
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
          if npm view "jonobones@$VERSION" version >/dev/null 2>&1; then
            echo "jonobones@$VERSION is already on the registry — skipping"
            exit 0
          fi
          npm publish

      # The scoped alias: same version, depends on the exact canonical
      # release, same binary. Needs its own trusted-publisher config.
      - name: Publish @parkviewlab/jonobones alias (skips when already published)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@parkviewlab/jonobones@$VERSION" version >/dev/null 2>&1; then
            echo "@parkviewlab/jonobones@$VERSION is already on the registry — skipping"
            exit 0
          fi
          node scripts/build-scoped-alias.mjs
          cd alias-build && npm publish
