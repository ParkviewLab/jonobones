name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # The load-bearing proof of the product: round-trips against the OFFICIAL
  # joplin CLI over a shared filesystem sync target, plaintext and E2EE.
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the official joplin CLI
        run: npm install -g joplin

      - name: Interop round-trip suite
        run: npm run test:interop

  # Image build sanity (no publish — registry/publishing is the owner's call).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t jonobones:ci .

      - name: Boot container and check /v1/health
        run: |
          docker run -d --name jb -p 127.0.0.1:26637:26637 \
            -e JONOBONES_API_TOKEN=ci-smoke-token jonobones:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:26637/v1/health; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || (docker logs jb; exit 1)
          docker rm -f jb

  # Full-system proof: a real Joplin Server (Docker) + the official joplin
  # CLI + the example app, all through one daemon — sync fidelity, SSE
  # events, E2EE, and resilience over sync target 9.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOPLIN_SERVER_IMAGE: joplin/server:3.7.1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the official joplin CLI
        run: npm install -g joplin

      # Cache the server image as a tarball: insulates the job from Docker
      # Hub pull rate limits and shaves the pull on every warm run.
      - name: Restore Joplin Server image cache
        id: image-cache
        uses: actions/cache@v5
        with:
          path: /tmp/joplin-server-image.tar
          key: ${{ env.JOPLIN_SERVER_IMAGE }}

      - name: Load or pull the Joplin Server image
        run: |
          if [ -f /tmp/joplin-server-image.tar ]; then
            docker load -i /tmp/joplin-server-image.tar
          else
            docker pull "$JOPLIN_SERVER_IMAGE"
            docker save -o /tmp/joplin-server-image.tar "$JOPLIN_SERVER_IMAGE"
          fi

      - name: E2E suite
        run: npm run test:e2e
